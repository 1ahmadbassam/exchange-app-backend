            application/json:
              schema:
                $ref: '#/components/schemas/Dealer'
              examples:
                Example:
                  summary: Example dealer record
                  value:
                    id: 1
                    lng: 35.4955
                    lat: 33.8886
                    name: "Exchange Beirut"
                    address: "Hamra Street, Beirut"
                    rating: 4.8
                    usd_to_lbp: 89500
                    lbp_to_usd: 88000
                    phone_number: "+96171234567"
                    created_at: "2025-04-17T14:30:00Z"
        '400':
          description: Dealer not found or bad input
          content:
            application/json:
              examples:
                NotRegistered:
                  summary: Not registered
                  value:
                    error: "Not registered as dealer"
                Missing:
                  summary: No ID and no token
                  value:
                    error: "Missing required fields"
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /dealer/all:
    get:
      summary: Retrieve all dealers
      tags: [ Dealer Management ]
      description: |
        Publicly available endpoint that returns all registered dealer entries.
      operationId: getAllDealers
      responses:
        '200':
          $ref: '#/components/responses/DealersResponse'
  /accessibility:
    get:
      summary: Retrieve the accessibility settings for the authenticated user
      tags: [ Accessibility Management ]
      description: |
        This endpoint retrieves the accessibility settings (inverted colors, sonification, narration) of the authenticated user.
        A valid JWT token is required in the Authorization header.
      operationId: getAccessibility
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Accessibility settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accessibility'
              examples:
                Success:
                  summary: Retrieved accessibility settings
                  value:
                    user_id: 1
                    inverted_colors: true
                    sonification: false
                    narration: true
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
    post:
      summary: Update the accessibility settings for the authenticated user
      tags: [ Accessibility Management ]
      description: |
        Allows the authenticated user to update their accessibility settings. The user can enable or disable features such as
        inverted colors, sonification, and narration. A valid JWT token is required in the Authorization header.
        Only the changed entries can be updated using this API by providing the valid feature tag and value, and the others could
        be left unchanged.
      operationId: setAccessibility
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/AccessibilityUpdate'
      responses:
        '200':
          description: Accessibility settings successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accessibility'
              examples:
                Success:
                  summary: Successfully updated accessibility settings
                  value:
                    user_id: 1
                    inverted_colors: true
                    sonification: false
                    narration: true
        '400':
          description: Invalid input for a feature
          content:
            application/json:
              examples:
                InvalidSonification:
                  summary: Invalid value for sonification
                  value:
                    error: "Invalid value for sonification, must be a boolean"
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /news:
    get:
      summary: Retrieve a list of news articles
      tags: [ News Management ]
      description: |
        This endpoint retrieves news articles. You can optionally specify the number of news articles to retrieve using the `count` query parameter. 
        If no count is provided, all available news articles will be returned (max 50). 
        News articles are asynchronously refreshed on the backend every 15 minutes without the need for requests to this endpoint.
      operationId: getNews
      parameters:
        - name: count
          in: query
          required: false
          schema:
            type: integer
            description: Number of news articles to retrieve.
      responses:
        '200':
          $ref: '#/components/responses/NewsResponse'
        '400':
          description: Invalid count query parameter
          content:
            application/json:
              examples:
                InvalidCount:
                  summary: Invalid count parameter
                  value:
                    error: "Invalid count value, must be greater than 0."
components:
  schemas:
    UnconfirmedUser:
      type: object
      properties:
        user_name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: integer
        user_name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
    Transaction:
      type: object
      properties:
        id:
          type: integer
        usd_amount:
          type: number
        lbp_amount:
          type: number
        usd_to_lbp:
          type: boolean
        user_id:
          type:
            - integer
            - 'null'
          description: ID of user associated with transaction.
        added_date:
          type: string
          format: date-time
          description: Date and time a transaction was added.
    Trend:
      type: object
      properties:
        former_rate:
          type:
            - number
            - 'null'
        current_rate:
          type:
            - number
            - 'null'
        percentage_change:
          type:
            - number
            - 'null'
        message:
          type: string
    Volatility:
      type: object
      properties:
        standard_deviation:
          type:
            - number
            - 'null'
        min_rate:
          type:
            - number
            - 'null'
        max_rate:
          type:
            - number
            - 'null'
        message:
          type: string
    Volume:
      type: object
      properties:
        date:
          type: string
          format: date
        usd_to_lbp:
          type: object
          properties:
            total_amount:
              type:
                - number
                - 'null'
            transaction_count:
              type: integer
        lbp_to_usd:
          type: object
          properties:
            total_amount:
              type:
                - number
                - 'null'
            transaction_count:
              type: integer
    Rate:
      type: object
      properties:
        date:
          type: string
          format: date
        usd_to_lbp:
          type:
            - number
            - 'null'
        lbp_to_usd:
          type:
            - number
            - 'null'
    Offer:
      type: object
      properties:
        id:
          type: integer
        usd_amount:
          type: number
        lbp_amount:
          type: number
        usd_to_lbp:
          type: boolean
        location:
          type: string
        phone_number:
          type: string
        user_id:
          type: integer
          description: ID of user associated with the offer.
        available:
          type: boolean
          description: Indicates whether the offer is still available or has been taken.
        created_at:
          type: string
          format: date-time
    Wallet:
      type: object
      properties:
        user_id:
          type: integer
          description: ID of the user associated with the wallet
        usd_amount:
          type: number
          format: float
          description: Amount of USD in the wallet
        lbp_amount:
          type: number
          format: float
          description: Amount of LBP in the wallet
      required:
        - user_id
        - usd_amount
        - lbp_amount
    WalletTransaction:
      type: object
      properties:
        id:
          type: integer
          description: The unique ID of the wallet transaction
        usd_amount:
          type: number
          format: float
          description: The amount of USD in the transaction
        lbp_amount:
          type: number
          format: float
          description: The amount of LBP in the transaction
        added_date:
          type: string
          format: date-time
          description: Date and time when the transaction was added
        user_id:
          type: integer
          description: ID of the user associated with the wallet transaction
        description:
          type: string
          description: Description or details about the transaction
      required:
        - usd_amount
        - lbp_amount
        - added_date
        - user_id
        - description
    Dealer:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the dealer.
        lng:
          type: number
          format: float
          description: Longitude coordinate of the dealer's location.
        lat:
          type: number
          format: float
          description: Latitude coordinate of the dealer's location.
        name:
          type: string
          description: Name of the dealer.
        address:
          type: string
          description: Physical address of the dealer.
        rating:
          type: number
          format: float
          description: Dealer's rating over 5.
        usd_to_lbp:
          type: number
          format: float
          description: Dealer's offered exchange rate from USD to LBP.
        lbp_to_usd:
          type: number
          format: float
          description: Dealer's offered exchange rate from LBP to USD.
        phone_number:
          type: string
          description: Contact phone number for the dealer.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the dealer entry was created.
      required:
        - lng
        - lat
        - name
        - address
        - rating
        - usd_to_lbp
        - lbp_to_usd
        - phone_number
        - created_at
    Accessibility:
      type: object
      properties:
        user_id:
          type: integer
          description: The unique ID of the user associated with the accessibility settings.
        inverted_colors:
          type: boolean
          description: Whether inverted colors are enabled for the user interface.
        sonification:
          type: boolean
          description: Whether sonification (audio cues) is enabled for the user interface.
        narration:
          type: boolean
          description: Whether narration (audio descriptions) is enabled for the user interface.
      required:
        - user_id
        - inverted_colors
        - sonification
        - narration
    News:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the news article.
        headline:
          type: string
          description: The headline of the news article.
        content:
          type: string
          description: Additional content of the news article.
        source:
          type: string
          description: The source from which the news article is derived.
        impact:
          type: integer
          description: Impact score of the news article (over 100).
        impact_summary:
          type: string
          description: A summary of the impact of the news article.
        confidence:
          type: number
          format: float
          description: The confidence level in the accuracy of the impact rating of the news article (0 to 1).
        timestamp:
          type: string
          format: date-time
          description: The timestamp when the news article was published.
        url:
          type: string
          description: The URL of the news article.
        image:
          type: string
          description: Base64 encoded image associated with the news article.
      required:
        - headline
        - content
        - source
        - impact
        - impact_summary
        - confidence
        - timestamp
        - url
        - image
  parameters:
    StartDate:
      name: start_date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Start date for the range (inclusive).
    EndDate:
      name: end_date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: End date for the range (inclusive).
  requestBodies:
    Transaction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Transaction'
          examples:
            Example:
              value:
                usd_amount: 10
                lbp_amount: 900000
                usd_to_lbp: true
    User:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - user_name
              - email
              - password
            properties:
              user_name:
                type: string
                maxLength: 30
              password:
                type: string
              email:
                type: string
                maxLength: 128
          examples:
            Example:
              value:
                user_name: ahmadb
                email: aae112@mail.aub.edu
                password: mySecurePassword123
    Authentication:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - user_name
              - password
            properties:
              user_name:
                type: string
              password:
                type: string
              otp:
                type: string
                description: >
                  Optional one-time password (TOTP) generated from a 2FA app. Required if the user has 2FA enabled.
          examples:
            Without2FA:
              summary: Login without TOTP (2FA disabled)
              value:
                user_name: ahmadb
                password: mySecurePassword123
            With2FA:
              summary: Login with TOTP (2FA enabled)
              value:
                user_name: ahmadb
                password: mySecurePassword123
                otp: "123456"
    Offer:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - usd_amount
              - lbp_amount
              - usd_to_lbp
              - location
              - phone_number
            properties:
              usd_amount:
                type: number
              lbp_amount:
                type: number
              usd_to_lbp:
                type: boolean
              location:
                type: string
              phone_number:
                type: string
          examples:
            Example:
              summary: Example offer submission
              value:
                usd_amount: 10
                lbp_amount: 900000
                usd_to_lbp: true
                location: "Beirut"
                phone_number: "+96171234567"
    PasswordResetRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                description: The email address to send the reset link to.
          examples:
            Example:
              summary: Request password reset email
              value:
                email: "aae112@mail.aub.edu"
    WalletTransactionRequest:
      content:
        application/json:
          schema:
            type: object
            required:
              - description
            properties:
              usd_amount:
                type: number
                format: float
                description: Amount of USD in the transaction
              lbp_amount:
                type: number
                format: float
                description: Amount of LBP in the transaction
              description:
                type: string
                description: Description of the transaction
          examples:
            Example:
              summary: Add new wallet transaction
              value:
                usd_amount: 20.00
                lbp_amount: 1800000
                description: "USD to LBP exchange"
    DealerRegistrationRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - lng
              - lat
              - name
              - address
              - rating
              - usd_to_lbp
              - lbp_to_usd
              - phone_number
            properties:
              lng:
                type: number
              lat:
                type: number
              name:
                type: string
                maxLength: 128
              address:
                type: string
                maxLength: 128
              rating:
                type: number
                minimum: 0
                maximum: 5
              usd_to_lbp:
                type: number
              lbp_to_usd:
                type: number
              phone_number:
                type: string
          examples:
            Example:
              summary: Dealer registration
              value:
                lng: 35.4955
                lat: 33.8886
                name: "Exchange Beirut"
                address: "Hamra Street"
                rating: 4.9
                usd_to_lbp: 89500
                lbp_to_usd: 88000
                phone_number: "+96171234567"
    DealerUpdateRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              lng:
                type: number
              lat:
                type: number
              name:
                type: string
                maxLength: 128
              address:
                type: string
                maxLength: 128
              rating:
                type: number
                minimum: 0
                maximum: 5
              usd_to_lbp:
                type: number
              lbp_to_usd:
                type: number
              phone_number:
                type: string
          examples:
            PartialUpdate:
              summary: Updating only rates
              value:
                usd_to_lbp: 90000
                lbp_to_usd: 88500
    AccessibilityUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              inverted_colors:
                type: boolean
                description: Enable or disable inverted colors
              sonification:
                type: boolean
                description: Enable or disable sonification (audio cues)
              narration:
                type: boolean
                description: Enable or disable narration (audio descriptions)
          examples:
            Example:
              summary: Update accessibility settings
              value:
                inverted_colors: true
                narration: true
  responses:
    TransactionCreated:
      description: Transaction successfully added
