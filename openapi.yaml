#file: noinspection YAMLSchemaValidation
openapi: 3.1.0
info:
  title: LBP-USD Exchange OpenAPI Specification
  description: >-
    This API provides backend support for a multi-platform LBP-USD exchange
    tracking application, including a web frontend,

    a Kotlin-based Android mobile app, and a JavaFX desktop application. It
    allows users to register and authenticate using

    secure JWT-based tokens, record currency exchange transactions (both USD to
    LBP and LBP to USD), and retrieve the average

    exchange rates based on recent historical data. The exchange rates are
    calculated using a simple average of all recorded

    transactions from the last 72 hours, offering users a transparent view of
    currency trends. The API enforces input validation,

    positive value constraints, rate limiting, and password hashing to ensure
    both accuracy and security.


    Users across all platforms submit new exchange transactions, securely log
    in, and view updated average exchange rates. These clients interact with the
    same REST endpoints and rely on the same authentication mechanisms, making
    the API a consistent and centralized service for all platforms. The backend
    is built using Flask and SQLAlchemy, supports CORS for cross-platform
    development, and is designed to be easy to integrate with

    lightweight UIs for both desktop and mobile environments.
    
    The exchange rate in this app is derived in the following way:
      - The daily exchange rate is the rate over the past 72 hours (three days).
      - The monthly exchange rate is the average of the daily exchange rates over the past month.
      - The yearly exchange rate is the average of the monthly exchange rates over the past year.
  contact:
    name: Development Team
    email: >-
      aae112@mail.aub.edu, ikh02@mail.aub.edu, mhw07@mail.aub.edu,
      mzr02@mail.aub.edu
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  version: 1.0.3
tags:
  - name: "Exchange Rates"
    description: "Endpoints related to exchange rate information."
  - name: "Transactions"
    description: "Endpoints related to transactions between USD and LBP."
  - name: "User Management"
    description: "Endpoints for user registration, authentication, and user-specific data."
  - name: "Internal User Management"
    description: "Internal endpoints for user registration, authentication, and user-specific data."
  - name: "Multi-Factor Authentication"
    description: >
      Endpoints for managing Two-Factor Authentication (2FA) using Time-Based One-Time Passwords (TOTP).
      This includes setting up 2FA, verifying OTP codes, refreshing TOTP authentication, and removing 2FA.
  - name: "Exchange Offers"
    description: "Endpoints for managing peer-to-peer exchange offers between users."
  - name: "Wallet Management"
    description: "Endpoints related to managing the user's wallet, including transactions, balances, and wallet reset functionality."
  - name: "Dealer Management"
    description: "Endpoints for registering, updating, deleting, and retrieving exchange dealers."
  - name: "Accessibility Management"
    description: "Endpoints for managing user accessibility settings, such as inverted colors, sonification, and narration."
  - name: "News Management"
    description: "Endpoints for retrieving news articles, including headlines, content, and associated metadata."
servers:
  - url: http://127.0.0.1:5000
    description: Local development server
paths:
  /authentication:
    post:
      summary: Authenticate user and issue JWT token
      tags: [ User Management ]
      description: >
        Authenticates a verified user using their username and password. If successful, a
        JWT token is returned for subsequent requests. The token must be
        included in the Authorization header as a bearer token.
        If a user has not verified their email, an appropriate error is returned informing
        the user to verify it.
      operationId: authenticateUser
      requestBody:
        $ref: '#/components/requestBodies/Authentication'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokenResponse'
        '400':
          description: Invalid input format
          content:
            application/json:
              examples:
                InvalidInput:
                  summary: Missing or invalid fields
                  value:
                    error: Invalid input format
        '401':
          description: TOTP is required for users with 2FA
          content:
            application/json:
              examples:
                TOTPRequired:
                  summary: TOTP not provided
                  value:
                    error: TOTP Required
        '403':
          description: Invalid credentials or OTP
          content:
            application/json:
              examples:
                InvalidCredentials:
                  summary: Incorrect username or password
                  value:
                    error: Invalid credentials
                InvalidOTP:
                  summary: Incorrect OTP
                  value:
                    error: Invalid OTP
        '409':
          description: Email not verified
          content:
            application/json:
              examples:
                VerifyEmail:
                  summary: Verify email before logging in
                  value:
                    error: Please verify your email before logging in
  /user:
    get:
      summary: Retrieve the authenticated user's details
      tags: [ User Management ]
      description: |
        This endpoint retrieves the details of the authenticated user. The user must provide a valid JWT token in the 
        Authorization header. If the token is valid, the user details are returned. If the token is invalid or expired, 
        an error response is provided.
      operationId: getUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                Success:
                  summary: Successfully fetched user details
                  value:
                    id: 10
                    user_name: "ahmadb"
                    email: "aae112@mail.aub.edu"
                    created_at: "2025-04-09T18:25:00Z"
                    verified_at: "2025-04-09T18:29:00Z"
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
    post:
      summary: Register a new user
      tags: [ User Management ]
      description: |
        Registers a new user with a unique username and password. The username must not already be taken, the password is hashed and securely stored. This route does not require authentication.
        The password must meet the following criteria: at least 12 characters long, with at least 2 uppercase letters, 2 numbers, and a symbol. The password's strength is evaluated with a minimum permissible score of 0.4 and a minimum permissible entropy of 70 bits.
        Email verification is required for users to use the platform. A verification email will be sent if no other errors are encountered, and the user does not exist on the system until his email address is verified.
      operationId: createUser
      requestBody:
        $ref: '#/components/requestBodies/User'
      responses:
        '200':
          $ref: '#/components/responses/UserCreated'
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              examples:
                UserExists:
                  summary: Username taken
                  value:
                    error: User already exists
                InvalidInput:
                  summary: Missing or invalid fields
                  value:
                    error: Invalid input format
                InvalidEmail:
                  summary: Invalid email format
                  value:
                    error: Email not valid
                EmailAlreadyRegistered:
                  summary: Email is already registered
                  value:
                    error: Email already registered
        '403':
          $ref: '#/components/responses/WeakPasswordResponse'
  /user/delete:
    post:
      summary: Delete the authenticated user
      tags: [ User Management ]
      description: >
        Deletes the currently authenticated user account. This action is irreversible.
        If the user has Two-Factor Authentication (2FA) enabled, a valid TOTP code is required
        and must be included in the request body. Otherwise, deletion will be denied.
      operationId: deleteUser
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  type: string
                  description: >
                    One-Time Password generated by the user's TOTP app (required if 2FA is enabled).
            examples:
              Without2FA:
                summary: Request without 2FA
                value: { }
              With2FA:
                summary: Request with valid TOTP
                value:
                  otp: "123456"
      responses:
        '200':
          description: User deleted successfully.
        '401':
          description: TOTP required but not provided.
          content:
            application/json:
              examples:
                TOTPRequired:
                  summary: Missing OTP
                  value:
                    error: TOTP Required
        '403':
          description: Invalid token or OTP.
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Expired or invalid token
                  value:
                    error: Invalid or expired token
                InvalidOTP:
                  summary: OTP provided but incorrect
                  value:
                    error: Invalid OTP
  /verify:
    post:
      summary: Resend email verification link
      tags: [ User Management ]
      description: |
        Resends the email verification link to the specified email address.
        The email should be the one used during user registration. If the email is valid and unconfirmed,
        a new verification email will be sent to the user.
      operationId: resendVerifyUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  description: The email address to resend the verification link to.
            examples:
              Example:
                summary: Resend verification email
                value:
                  email: "aae112@mail.aub.edu"
      responses:
        '200':
          $ref: '#/components/responses/UserVerifyRequested'
        '400':
          description: Missing or invalid email address.
          content:
            application/json:
              examples:
                InvalidEmail:
                  summary: Invalid email format
                  value:
                    error: Email not valid
        '403':
          description: Email is already verified or invalid email.
          content:
            application/json:
              examples:
                EmailAlreadyVerified:
                  summary: Email is already verified
                  value:
                    error: Email already verified
                InvalidEmail:
                  summary: Email is not found
                  value:
                    error: Email not valid
  /verify/{token}:
    get:
      summary: Verify user email using token
      tags: [ Internal User Management ]
      description: |
        This endpoint validates the verification token sent to the user’s email. If valid, the user is marked as confirmed.
        It also checks if the user is already verified, and if not, it confirms the user and adds him to the database.
      operationId: verifyUser
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The verification token received in the user's email.
      responses:
        '200':
          description: User successfully verified
        '400':
          description: User already verified
          content:
            application/json:
              examples:
                UserAlreadyVerified:
                  summary: User already verified
                  value:
                    error: "Email already verified"
        '403':
          description: Invalid or expired token or invalid email
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired verification token
                  value:
                    error: "Invalid or expired verification token"
                InvalidEmail:
                  summary: Email not valid
                  value:
                    error: "Email not valid"
  /reset:
    post:
      summary: Request password reset email
      tags: [ User Management ]
      description: |
        Allows the user to request a password reset email. The email address provided will receive a link to reset the password.
      operationId: passwordResetRequest
      requestBody:
        $ref: '#/components/requestBodies/PasswordResetRequest'
      responses:
        '200':
          description: Password reset request was successful
        '400':
          description: Missing or invalid email address, or password changed recently
          content:
            application/json:
              examples:
                MissingFields:
                  summary: Missing email
                  value:
                    error: Missing required fields
                InvalidEmail:
                  summary: Invalid email format
                  value:
                    error: Email not valid
                PasswordRecentlyChanged:
                  summary: Password changed recently
                  value:
                    error: Password changed recently. Please wait at least one hour since you last changed your password.
        '403':
          description: Email address not registered or unable to process the request
          content:
            application/json:
              examples:
                EmailNotFound:
                  summary: Email not found in the system
                  value:
                    error: Email not valid
  /reset/{token}:
    get:
      summary: Show password reset form
      tags: [ Internal User Management ]
      description: |
        Validates the password reset token and shows the form where the user can reset their password.
      operationId: passwordResetForm
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The password reset token received via email.
      responses:
        '200':
          description: Show password reset HTML form
        '403':
          description: |
            Show error HTML page: Invalid or expired token
    post:
      summary: Reset user password
      tags: [ Internal User Management ]
      description: |
        Allows the user to reset their password using the token provided. The new password must meet the 
        password complexity requirements. The password must meet the following criteria: at least 12 characters long, 
        with at least 2 uppercase letters, 2 numbers, and a symbol. The password's strength is evaluated with a minimum 
        permissible score of 0.4 and a minimum permissible entropy of 70 bits.
        Unconfirmed users are also allowed to reset their password.
      operationId: passwordReset
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The password reset token received via email. Passed to the HTML page link in the original GET response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: The new password to set.
            examples:
              Example:
                summary: Reset password request
                value:
                  password: "newSecurePassword123!"
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              examples:
                PasswordResetSuccess:
                  summary: Password successfully reset
                  value:
                    message: Password successfully reset! You can close this page.
        '400':
          description: Missing or invalid password, password changed recently, or reusing old password
          content:
            application/json:
              examples:
                InvalidPassword:
                  summary: Invalid password format
                  value:
                    error: "Invalid password"
                PasswordRecentlyChanged:
                  summary: Password changed recently
                  value:
                    error: Password changed recently. Please wait at least one hour since you last changed your password.
                PasswordReuse:
                  summary: Reusing old password
                  value:
                    error: Cannot set password to be the same as the old one
        '403':
          $ref: '#/components/responses/WeakPasswordResponse'
  /password-strength:
    post:
      summary: Check the strength of a password
      tags:
        - User Management
      description: |
        Checks the strength of a given password and returns a strength score or a classification.
        The strength is calculated based on factors like length, use of special characters, numbers, uppercase letters, etc.
        The strength of a password is reported from 0 to 1.
      operationId: checkPasswordStrength
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: The password to check
            examples:
              Example:
                summary: Request example
                value:
                  password: "P@ssw0rd123"
      responses:
        '200':
          $ref: '#/components/responses/PasswordStrengthResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /mfa/check:
    get:
      summary: Check the MFA status for the authenticated user
      tags: [ Multi-Factor Authentication ]
      description: |
        This endpoint checks the status of Multi-Factor Authentication (MFA) for the authenticated user.
        If MFA is enabled, the response will return `true`. Otherwise, it will return `false`.
      operationId: getMfaCheck
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Successfully retrieved MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfa:
                    type: boolean
                    description: Indicates if MFA is enabled for the user
              examples:
                Success:
                  summary: MFA status checked
                  value:
                    mfa: true
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /mfa/register:
    get:
      summary: Generate MFA setup URI and QR code
      tags: [ Multi-Factor Authentication ]
      description: >
        Returns the provisioning URI and base64-encoded QR code image for setting up 
        Two-Factor Authentication (2FA) using a TOTP-based authenticator app.
        Requires authentication via bearer token.
      operationId: getMfaSetup
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/MFAObtainedResponse'
        '400':
          description: MFA already enabled
          content:
            application/json:
              examples:
                MFAExists:
                  summary: MFA already enabled
                  value:
                    error: MFA already enabled
        '403':
          description: Invalid or expired token or OTP
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: Invalid or expired token
                InvalidOTP:
                  summary: Invalid OTP
                  value:
                    error: Invalid OTP
    post:
      summary: Finalize MFA setup by verifying OTP
      tags: [ Multi-Factor Authentication ]
      description: >
        Verifies the TOTP code provided by the user and activates 2FA for their account.
        Requires authentication and the OTP from the user's authenticator app.
      operationId: registerMfa
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  description: One-Time Password generated by TOTP app
            examples:
              Example:
                value:
                  otp: "123456"
      responses:
        '200':
          description: MFA activated successfully
        '403':
          description: Invalid or expired token or OTP
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: Invalid or expired token
                InvalidOTP:
                  summary: Invalid OTP
                  value:
                    error: Invalid OTP
  /mfa/refresh:
    post:
      summary: Re-authenticate MFA using TOTP
      tags: [ Multi-Factor Authentication ]
      description: >
        Allows the user to re-authenticate using TOTP without making any changes to their MFA configuration.
        Useful for verifying access before sensitive operations.
      operationId: refreshMfa
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  description: One-Time Password generated by TOTP app
            examples:
              Example:
                value:
                  otp: "123456"
      responses:
        '200':
          description: MFA re-authentication successful
        '400':
          description: MFA not enabled
          content:
            application/json:
              examples:
                NoMFA:
                  summary: MFA not enabled
                  value:
                    error: MFA not enabled
        '403':
          description: Invalid or expired token or OTP
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: Invalid or expired token
                InvalidOTP:
                  summary: Invalid OTP
                  value:
                    error: Invalid OTP
  /mfa/remove:
    post:
      summary: Disable MFA for authenticated user
      tags: [ Multi-Factor Authentication ]
      description: >
        Disables Two-Factor Authentication (2FA) for the current user after verifying their TOTP.
        Requires authentication and OTP verification.
      operationId: removeMfa
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  description: One-Time Password generated by TOTP app
            examples:
              Example:
                value:
                  otp: "123456"
      responses:
        '200':
          description: MFA removed successfully
        '400':
          description: MFA not enabled
          content:
            application/json:
              examples:
                NoMFA:
                  summary: MFA not enabled
                  value:
                    error: MFA not enabled
        '403':
          description: Invalid or expired token or OTP
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: Invalid or expired token
                InvalidOTP:
                  summary: Invalid OTP
                  value:
                    error: Invalid OTP

  /transaction:
    post:
      summary: Submit a new LBP-USD or USD-LBP exchange transaction
      tags: [ Transactions ]
      description: >
        Allows an anonymous or authenticated user to submit a new currency
        exchange transaction. The user must specify whether the transaction is
        USD to LBP or LBP to USD, along with the exchanged amounts. The
        transaction will be stored and later used to compute the average
        exchange rate. Authentication presented must be valid or transaction
        will be rejected.
        Authenticated user must have enough USD or LBP in personal wallet as appropriate 
        before performing transaction; else, it is rejected.
      operationId: addTransaction
      security:
        - bearerAuth: [ ]
        - { }
      requestBody:
        $ref: '#/components/requestBodies/Transaction'
      responses:
        '200':
          $ref: '#/components/responses/TransactionCreated'
        '400':
          description: Invalid transaction input. Amounts must be positive numbers.
          content:
            application/json:
              examples:
                InvalidAmount:
                  summary: Negative amount
                  value:
                    error: Invalid amount
        '401':
          $ref: '#/components/responses/BalanceNeededResponse'
        '403':
          description: Invalid or expired authentication token. Access is forbidden.
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Invalid JWT
                  value:
                    error: Access is forbidden
    get:
      summary: Retrieve all transactions for the authenticated user
      tags: [ Transactions ]
      description: >
        Fetches all the exchange transactions submitted by the currently
        authenticated user. The data includes the amount, exchange direction,
        and submission date of each transaction. A valid JWT token must be
        provided in the Authorization header.
      operationId: getUserTransactions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/TransactionList'
        '403':
          description: Missing, invalid, or expired JWT token
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Invalid JWT
                  value:
                    error: Access is forbidden
  /exchangeRate:
    get:
      summary: Get exchange rate
      tags: [ Exchange Rates ]
      description: >-
        Retrieve the average exchange rate based on transactions from the last 72 hours.
      operationId: getExchangeRate
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRateResponse'
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Server error
                  value:
                    error: Internal server error
  /exchangeRate/trend:
    get:
      summary: Get exchange rate trend
      description: >
        Provides insights into the trend of exchange rates (USD to LBP and LBP to USD) over a specified period.
        The trend compares between rate today and rate with specified time period (e.g. 7 days).
        Returns a positive percentage if the trend is increasing and a negative one if it is decreasing.
      operationId: getExchangeRateTrend
      tags: [ Exchange Rates ]
      parameters:
        - in: query
          name: period
          required: true
          schema:
            type: string
            enum: [ 24h, 7d, 30d, 3mon, 6mon, 1yr ]
          description: Time range for trend of exchange rates.
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRateTrendResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /exchangeRate/volatility:
    get:
      summary: Get exchange rate volatility
      description: >
        Measures the volatility of exchange rates (USD to LBP and LBP to USD) over a specified time period compared to today.
        Returns the standard deviation, range (min and max), and a human-readable message describing the volatility.
      operationId: getExchangeRateVolatility
      tags: [ Exchange Rates ]
      parameters:
        - in: query
          name: period
          required: true
          schema:
            type: string
            enum: [ 24h, 7d, 30d, 3mon, 6mon, 1yr ]
          description: Time range over which to calculate exchange rate volatility.
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRateVolatilityResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /exchangeRate/hourly:
    get:
      summary: Get hourly exchange rates over the past 24 hours
      description: >
        Returns the average exchange rates per hour for USD to LBP and LBP to USD,
        over the last 24 hours from the current time. Each entry represents
        the average rate during a one-hour window. Each entry is the average over the past 72 hours from it.
      tags: [ Exchange Rates ]
      operationId: getHourlyExchangeRates
      responses:
        '200':
          $ref: '#/components/responses/HourlyExchangeRateResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /exchangeRate/daily:
    get:
      summary: Get daily exchange rates
      description: >
        Returns the average daily exchange rates for USD to LBP and LBP to USD between the specified start and end dates (inclusive).
      operationId: getDailyExchangeRates
      tags: [ Exchange Rates ]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          $ref: '#/components/responses/DailyExchangeRateResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
