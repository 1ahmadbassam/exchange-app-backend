#file: noinspection YAMLSchemaValidation
openapi: 3.1.0
info:
  title: LBP-USD Exchange OpenAPI Specification
  description: >-
    This API provides backend support for a multi-platform LBP-USD exchange
    tracking application, including a web frontend,

    a Kotlin-based Android mobile app, and a JavaFX desktop application. It
    allows users to register and authenticate using

    secure JWT-based tokens, record currency exchange transactions (both USD to
    LBP and LBP to USD), and retrieve the average

    exchange rates based on recent historical data. The exchange rates are
    calculated using a simple average of all recorded

    transactions from the last 72 hours, offering users a transparent view of
    currency trends. The API enforces input validation,

    positive value constraints, rate limiting, and password hashing to ensure
    both accuracy and security.


    Users across all platforms submit new exchange transactions, securely log
    in, and view updated average exchange rates. These clients interact with the
    same REST endpoints and rely on the same authentication mechanisms, making
    the API a consistent and centralized service for all platforms. The backend
    is built using Flask and SQLAlchemy, supports CORS for cross-platform
    development, and is designed to be easy to integrate with

    lightweight UIs for both desktop and mobile environments.
    
    The exchange rate in this app is derived in the following way:
      - The daily exchange rate is the rate over the past 72 hours (three days).
      - The monthly exchange rate is the average of the daily exchange rates over the past month.
      - The yearly exchange rate is the average of the monthly exchange rates over the past year.
  contact:
    name: Development Team
    email: >-
      aae112@mail.aub.edu, ikh02@mail.aub.edu, mhw07@mail.aub.edu,
      mzr02@mail.aub.edu
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  version: 1.0.1
tags:
  - name: "Exchange Rates"
    description: "Endpoints related to exchange rate information."
  - name: "Transactions"
    description: "Endpoints related to transactions between USD and LBP."
  - name: "User Management"
    description: "Endpoints for user registration, authentication, and user-specific data."
  - name: "Exchange Offers"
    description: "Endpoints for managing peer-to-peer exchange offers between users."
servers:
  - url: http://127.0.0.1:5000
    description: Local development server
paths:
  /auth:
    post:
      summary: Authenticate user and issue JWT token
      tags: [ User Management ]
      description: >
        Authenticates a user using their username and password. If successful, a
        JWT token is returned for subsequent requests. The token must be
        included in the Authorization header as a bearer token.
      operationId: authenticateUser
      security:
        - none: []
      requestBody:
        $ref: '#/components/requestBodies/Authentication'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokenResponse'
        '400':
          description: Invalid input format
          content:
            application/json:
              examples:
                InvalidInput:
                  summary: Missing or invalid fields
                  value:
                    error: Invalid input format
        '403':
          description: Invalid username or password
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Invalid credentials
                  value:
                    error: Invalid username or password
  /user:
    post:
      summary: Register a new user
      tags: [ User Management ]
      description: |2
          Registers a new user with a unique username and password. The username must not already be taken, the password is hashed and securely stored. This route does not require authentication.
      operationId: createUser
      security:
        - none: []
      requestBody:
        $ref: '#/components/requestBodies/User'
      responses:
        '200':
          $ref: '#/components/responses/UserCreated'
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              examples:
                UserExists:
                  summary: Username taken
                  value:
                    error: User already exists
                InvalidInput:
                  summary: Missing or invalid fields
                  value:
                    error: Invalid input format
  /transaction:
    post:
      summary: Submit a new LBP-USD or USD-LBP exchange transaction
      tags: [ Transactions ]
      description: >
        Allows an anonymous or authenticated user to submit a new currency
        exchange transaction. The user must specify whether the transaction is
        USD to LBP or LBP to USD, along with the exchanged amounts. The
        transaction will be stored and later used to compute the average
        exchange rate. Authentication presented must be valid or transaction
        will be rejected.
      operationId: addTransaction
      security:
        - bearerAuth: []
        - {}
      requestBody:
        $ref: '#/components/requestBodies/Transaction'
      responses:
        '200':
          $ref: '#/components/responses/TransactionCreated'
        '400':
          description: Invalid transaction input. Amounts must be positive numbers.
          content:
            application/json:
              examples:
                InvalidAmount:
                  summary: Negative amount
                  value:
                    error: Invalid amount
        '403':
          description: Invalid or expired authentication token. Access is forbidden.
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Invalid JWT
                  value:
                    error: Access is forbidden
    get:
      summary: Retrieve all transactions for the authenticated user
      tags: [ Transactions ]
      description: >
        Fetches all the exchange transactions submitted by the currently
        authenticated user. The data includes the amount, exchange direction,
        and submission date of each transaction. A valid JWT token must be
        provided in the Authorization header.
      operationId: getUserTransactions
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/TransactionList'
        '403':
          description: Missing, invalid, or expired JWT token
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Invalid JWT
                  value:
                    error: Access is forbidden
  /exchangeRate:
    get:
      summary: Get exchange rate
      tags: [ Exchange Rates ]
      description: >-
        Retrieve the average exchange rate based on transactions from the last 72 hours.
      operationId: getExchangeRate
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRateResponse'
        '404':
          description: No transactions found in the last 3 days.
          content:
            application/json:
              examples:
                NoTransactionFound:
                  summary: string
                  value:
                    error: No transactions found in the last 3 days
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: string
                  value:
                    error: Internal server error
  /exchangeRate/trend:
    get:
      summary: Get exchange rate trend
      description: >
        Provides insights into the trend of exchange rates (USD to LBP and LBP to USD) over a specified period.
        The trend compares between rate today and rate with specified time period (e.g. 7 days).
        Returns a positive percentage if the trend is increasing and a negative one if it is decreasing.
      operationId: getExchangeRateTrend
      tags: [ Exchange Rates ]
      parameters:
        - in: query
          name: period
          required: true
          schema:
            type: string
            enum: [ 24h, 7d, 30d, 3mon, 6mon, 1yr ]
          description: Time range for trend of exchange rates.
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRateTrendResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /exchangeRate/volatility:
    get:
      summary: Get exchange rate volatility
      description: >
        Measures the volatility of exchange rates (USD to LBP and LBP to USD) over a specified time period compared to today.
        Returns the standard deviation, range (min and max), and a human-readable message describing the volatility.
      operationId: getExchangeRateVolatility
      tags: [ Exchange Rates ]
      parameters:
        - in: query
          name: period
          required: true
          schema:
            type: string
            enum: [ 24h, 7d, 30d, 3mon, 6mon, 1yr ]
          description: Time range over which to calculate exchange rate volatility.
      responses:
        '200':
          $ref: '#/components/responses/ExchangeRateVolatilityResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /exchangeRate/daily:
    get:
      summary: Get daily exchange rates
      description: >
        Returns the average daily exchange rates for USD to LBP and LBP to USD between the specified start and end dates (inclusive).
      operationId: getDailyExchangeRates
      tags: [ Exchange Rates ]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          $ref: '#/components/responses/DailyExchangeRateResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /transactions/volume/daily:
    get:
      summary: Get daily transaction volume
      description: >
        Returns the total volume and number of transactions per day for USD to LBP and LBP to USD between the specified start and end dates (inclusive).
      operationId: getDailyTransactionVolume
      tags: [ Transactions ]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          $ref: '#/components/responses/DailyTransactionVolumeResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /exchangeRate/monthly:
    get:
      summary: Get monthly exchange rates
      description: >
        Returns the average monthly exchange rates for USD to LBP and LBP to USD between the specified start and end dates (inclusive).
      operationId: getMonthlyExchangeRates
      tags: [ Exchange Rates ]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          $ref: '#/components/responses/MonthlyExchangeRateResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /transactions/volume/monthly:
    get:
      summary: Get monthly transaction volumes
      description: >
        Returns the total volume and number of transactions per month for USD to LBP and LBP to USD between the specified start and end dates (inclusive).
      operationId: getMonthlyTransactionVolume
      tags: [ Transactions ]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          $ref: '#/components/responses/MonthlyTransactionVolumeResponse'
        '400':
          description: Invalid or missing query parameter.
          content:
            application/json:
              examples:
                InvalidQuery:
                  summary: Invalid Query
                  value:
                    error: Bad request
        '500':
          description: Internal server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /offer:
    post:
      summary: Submit a new exchange offer
      description: >
        Allows an authenticated user to create a peer-to-peer exchange offer. The offer includes currency amounts, 
        direction (USD to LBP or LBP to USD), user location, and phone number.
      tags: [ Exchange Offers ]
      operationId: addExchangeOffer
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Offer'
      responses:
        '200':
          $ref: '#/components/responses/OfferCreated'
        '400':
          description: Invalid offer input.
          content:
            application/json:
              examples:
                InvalidData:
                  summary: Bad Request
                  value:
                    error: Invalid offer data
        '403':
          description: Authentication required or invalid token.
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized access
                  value:
                    error: Access is forbidden
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal server error
                  value:
                    error: Internal server error
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        user_name:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: integer
        usd_amount:
          type: number
        lbp_amount:
          type: number
        usd_to_lbp:
          type: boolean
        user_id:
          type:
            - integer
            - 'null'
          description: ID of user associated with transaction.
        added_date:
          type: string
          format: date
    Trend:
      type: object
      properties:
        former_rate:
          type:
            - number
            - 'null'
        current_rate:
          type:
            - number
            - 'null'
        percentage_change:
          type:
            - number
            - 'null'
        message:
          type: string
    Volatility:
      type: object
      properties:
        standard_deviation:
          type:
            - number
            - 'null'
        min_rate:
          type:
            - number
            - 'null'
        max_rate:
          type:
            - number
            - 'null'
        message:
          type: string
    Volume:
      type: object
      properties:
        date:
          type: string
          format: date
        usd_to_lbp:
          type: object
          properties:
            total_amount:
              type:
                - number
                - 'null'
            transaction_count:
              type: integer
        lbp_to_usd:
          type: object
          properties:
            total_amount:
              type:
                - number
                - 'null'
            transaction_count:
              type: integer
    Rate:
      type: object
      properties:
        date:
          type: string
          format: date
        usd_to_lbp:
          type:
            - number
            - 'null'
        lbp_to_usd:
          type:
            - number
            - 'null'
    Offer:
      type: object
      properties:
        id:
          type: integer
        usd_amount:
          type: number
        lbp_amount:
          type: number
        usd_to_lbp:
          type: boolean
        location:
          type: string
        phone_number:
          type: string
        user_id:
          type: integer
          description: ID of user associated with the offer.
        available:
          type: boolean
          description: Indicates whether the offer is still available or has been taken.
        created_at:
          type: string
          format: date-time
  parameters:
    StartDate:
      name: start_date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Start date for the range (inclusive).
    EndDate:
      name: end_date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: End date for the range (inclusive).
  requestBodies:
    Transaction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Transaction'
          examples:
            Example:
              value:
                usd_amount: 10
                lbp_amount: 900000
                usd_to_lbp: true
    User:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - user_name
              - password
            properties:
              user_name:
                type: string
                maxLength: 30
              password:
                type: string
          examples:
            Example:
              value:
                user_name: ahmadb
                password: mySecurePassword123
    Authentication:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - user_name
              - password
            properties:
              user_name:
                type: string
              password:
                type: string
          examples:
            Example:
              value:
                user_name: ahmadb
                password: mySecurePassword123
    Offer:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - usd_amount
              - lbp_amount
              - usd_to_lbp
              - location
              - phone_number
            properties:
              usd_amount:
                type: number
              lbp_amount:
                type: number
              usd_to_lbp:
                type: boolean
              location:
                type: string
              phone_number:
                type: string
          examples:
            Example:
              summary: Example offer submission
              value:
                usd_amount: 10
                lbp_amount: 900000
                usd_to_lbp: true
                location: "Beirut"
                phone_number: "+96171234567"
  responses:
    TransactionCreated:
      description: Transaction successfully added
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Transaction'
          examples:
            Success:
              value:
                id: 21
                usd_amount: 100
                lbp_amount: 9000000
                usd_to_lbp: true
                user_id: 3
                added_date: '2025-04-03'
    TransactionList:
      description: List of transactions associated with the authenticated user
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Transaction'
          examples:
            Example:
              value:
                - id: 12
                  usd_amount: 10
                  lbp_amount: 900000
                  usd_to_lbp: true
                  user_id: 1
                  added_date: '2025-04-02'
                - id: 13
                  usd_amount: 5
                  lbp_amount: 450000
                  usd_to_lbp: true
                  user_id: 1
                  added_date: '2025-04-02'
    UserCreated:
      description: User successfully registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
          examples:
            Success:
              value:
                id: 10
                user_name: ahmadb
    AuthTokenResponse:
      description: JWT token issued for authenticated session
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
          examples:
            Example:
              value:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ExchangeRateResponse:
      description: Exchange rate for the last 72 hours.
      content:
        application/json:
          schema:
            type: object
            properties:
              usd_to_lbp:
                type:             
                  - integer
                  - 'null'
              lbp_to_usd:
                type: 
                  - integer
                  - 'null'
          examples:
            Example:
              value:
                usd_to_lbp: 89800
                lbp_to_usd: 89700
    ExchangeRateTrendResponse:
      description: Exchange rate trend for the selected period.
      content:
        application/json:
          schema:
            type: object
            properties:
              # restore the original period
              period: 
                type: string
              usd_to_lbp:
                $ref: '#/components/schemas/Trend'
              lbp_to_usd:
                $ref: '#/components/schemas/Trend'
          examples:
            Example:
              summary: Example trend comparison
              value:
                period: 30d
                usd_to_lbp:
                  former_rate: 88500
                  current_rate: 89700
                  percentage_change: 1.36
                  message: The USD-LBP rate has risen by a factor of 1.36% from 88500 to 89700 over the past thirty days.
                lbp_to_usd:
                  former_rate: 89500
                  current_rate: 87800
                  percentage_change: -1.94
                  message: The LBP-USD rate has dropped by a factor of 1.94% from 89500 to 87800 over the past thirty days.
    ExchangeRateVolatilityResponse:
      description: Exchange rate volatility data for the selected period.
      content:
        application/json:
          schema:
            type: object
            properties:
              period:
                type: string
              usd_to_lbp:
                $ref: '#/components/schemas/Volatility'
              lbp_to_usd:
                $ref: '#/components/schemas/Volatility'
          examples:
            Example:
              summary: Example volatility data
              value:
                period: 7d
                usd_to_lbp:
                  standard_deviation: 1200.45
                  min_rate: 88500
                  max_rate: 90200
                  message: The USD-LBP exchange rate has shown moderate volatility over the past 7 days, ranging from 88500 to 90200.
                lbp_to_usd:
                  standard_deviation: 300.4
                  min_rate: 89700
                  max_rate: 89100
                  message: The LBP-USD rate has fluctuated slightly in the past 7 days.
    DailyExchangeRateResponse:
      description: Daily average exchange rates.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Rate'
          examples:
            Example:
              summary: Daily exchange rates
              value:
                - date: 2025-04-01
                  usd_to_lbp: null
                  lbp_to_usd: 89300
                - date: 2025-04-02
                  usd_to_lbp: 89400
                  lbp_to_usd: 89000
                - date: 2025-04-03
                  usd_to_lbp: 89500
                  lbp_to_usd: 89800
                - date: 2025-04-04
                  usd_to_lbp: 90100
                  lbp_to_usd: 89700
                - date: 2025-04-05
                  usd_to_lbp: 91200
                  lbp_to_usd: 90500
                - date: 2025-04-06
                  usd_to_lbp: 92400
                  lbp_to_usd: 91250
                - date: 2025-04-07
                  usd_to_lbp: null
                  lbp_to_usd: 92400
    MonthlyExchangeRateResponse:
      description: Monthly average exchange rates.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Rate'
          examples:
            Example:
              summary: Monthly exchange rates
              value:
                - date: 2024-04-01
                  usd_to_lbp: null
                  lbp_to_usd: 89300
                - date: 2024-05-01
                  usd_to_lbp: 89400
                  lbp_to_usd: 89000
                - date: 2024-06-01
                  usd_to_lbp: 89500
                  lbp_to_usd: 89800
                - date: 2024-07-01
                  usd_to_lbp: 90100
                  lbp_to_usd: 89700
                - date: 2024-08-01
                  usd_to_lbp: 91200
                  lbp_to_usd: 90500
                - date: 2025-09-01
                  usd_to_lbp: 92400
                  lbp_to_usd: 91250
                - date: 2025-10-01
                  usd_to_lbp: null
                  lbp_to_usd: 92400
    DailyTransactionVolumeResponse:
      description: Daily transaction volumes and counts.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Volume'
          examples:
            Example:
              summary: Daily volume data
              value:
                - date: 2025-04-01
                  usd_to_lbp:
                    total_amount: 24000
                    transaction_count: 8
                  lbp_to_usd:
                    total_amount: 20000000
                    transaction_count: 5
    MonthlyTransactionVolumeResponse:
      description: Monthly transaction volumes and counts.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Volume'
          examples:
            Example:
              summary: Monthly volume data
              value:
                - date: 2025-03-01
                  usd_to_lbp:
                    total_amount: 150000
                    transaction_count: 60
                  lbp_to_usd:
                    total_amount: 60000000
                    transaction_count: 40
                - date: 2025-04-01
                  usd_to_lbp:
                    total_amount: 120000
                    transaction_count: 50
                  lbp_to_usd:
                    total_amount: 48000000
                    transaction_count: 38
    OfferCreated:
      description: Offer successfully created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Offer'
          examples:
            Example:
              summary: Offer created successfully
              value:
                id: 15
                usd_amount: 10
                lbp_amount: 900000
                usd_to_lbp: true
                location: "Beirut"
                phone_number: "+96171234567"
                user_id: 3
                available: true
                created_at: "2025-04-10T12:00:00Z"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication using Bearer tokens
    none:
      type: http
      scheme: none
      description: No authentication required
