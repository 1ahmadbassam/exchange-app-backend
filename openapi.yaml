                    error: "Not registered as dealer"
        '401':
          description: TOTP required
          content:
            application/json:
              examples:
                Required:
                  value:
                    error: "TOTP Required"
        '403':
          description: Invalid OTP or invalid authentication token
          content:
            application/json:
              examples:
                InvalidOtp:
                  summary: Invalid OTP
                  value:
                    error: "Invalid OTP"
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
