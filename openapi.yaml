  /offer:
    post:
      summary: Submit a new exchange offer
      description: >
        Allows an authenticated user to create a peer-to-peer exchange offer. The offer includes currency amounts, 
        direction (USD to LBP or LBP to USD), user location, and phone number.
        Authenticated user must have enough USD or LBP in personal wallet as appropriate 
        before adding offer; else, it is rejected. Moreover, to maintain wallet consistency, the amount allocated to 
        sell in offer is reserved by the system. If a user has inflight (active) offers, then he has less balance
        then what /wallet endpoint reports. This is by design.
      tags: [ Exchange Offers ]
      operationId: addExchangeOffer
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/Offer'
      responses:
        '200':
          $ref: '#/components/responses/OfferCreated'
        '400':
          description: Invalid offer input.
          content:
            application/json:
              examples:
                InvalidData:
                  summary: Bad Request
                  value:
                    error: Invalid offer data
        '401':
          $ref: '#/components/responses/BalanceNeededResponse'
        '403':
          description: Authentication required or invalid token.
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized access
                  value:
                    error: Access is forbidden
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal server error
                  value:
                    error: Internal server error
  /offer/delete:
    post:
      summary: Delete an offer by ID
      description: >
        Permanently deletes an offer from the system. The offer ID is passed in the JSON body.
        This action is irreversible. If the offer is still available, wallet inflight corrections are performed.
      tags: [ Exchange Offers ]
      operationId: deleteExchangeOffer
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
            examples:
              Example:
                summary: Delete offer by ID
                value:
                  id: 15
      responses:
        '200':
          description: Deletion successful.
        '400':
          description: Invalid offer input.
          content:
            application/json:
              examples:
                InvalidData:
                  summary: Bad Request
                  value:
                    error: Invalid offer data
        '403':
          description: Authentication required or invalid token.
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized access
                  value:
                    error: Access is forbidden
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal server error
                  value:
                    error: Internal server error
  /offer/update:
    post:
      summary: Update an offer by ID
      description: >
        Allows the user to update their own offer. All fields are optional. If no fields are provided, the request is valid but has no effect.
        The offer ID must be included in the request body. 
        The offer must be available else the request is denied. The creation date is updated to reflect the modification date.
        Authenticated user must have enough USD or LBP in personal wallet as appropriate 
        before adding offer; else, it is rejected. This is only relevant if the USD or LBP amounts are updated, which recalculates inflight values.
        Moreover, to maintain wallet consistency, the amount allocated to sell in offer is reserved by the system. 
        If a user has inflight (active) offers, then he has less balance then what /wallet endpoint reports. This is by design.
      tags: [ Exchange Offers ]
      operationId: updateExchangeOffer
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                usd_amount:
                  type: number
                lbp_amount:
                  type: number
                usd_to_lbp:
                  type: boolean
                location:
                  type: string
                phone_number:
                  type: string
            examples:
              Example:
                summary: Partial update
                value:
                  id: 15
                  usd_amount: 50
                  lbp_amount: 450000
      responses:
        '200':
          $ref: '#/components/responses/OfferUpdated'
        '400':
          description: Invalid offer input.
          content:
            application/json:
              examples:
                InvalidData:
                  summary: Bad Request
                  value:
                    error: Invalid offer data
        '401':
          $ref: '#/components/responses/BalanceNeededResponse'
        '403':
          description: Authentication required or invalid token.
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized access
                  value:
                    error: Access is forbidden
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal server error
                  value:
                    error: Internal server error
  /offer/available:
    get:
      summary: List all available exchange offers
      description: >
        Returns a list of all currently available (i.e., not taken) peer-to-peer exchange offers.
        No authentication is required. This allows users to browse offers submitted by others.
        It is important to note that the API works in the opposite way as these offers are stored as seller-oriented. 
        Hence, a buyer interprets a usd_to_lbp offer as one where he sells his LBP in exchange for USD, 
        whereas the seller sells his USD in exchange for LBP.
      tags: [ Exchange Offers ]
      operationId: getAvailableOffers
      responses:
        '200':
          $ref: '#/components/responses/OfferList'
        '500':
          description: Server error.
          content:
            application/json:
              examples:
                InternalError:
                  summary: Server error
                  value:
                    error: Internal server error
  /offer/my:
    get:
      summary: List offers submitted by the authenticated user
      description: >
        Returns all offers that were submitted by the currently authenticated user.
        This includes both available and taken offers (for history purposes).
      tags: [ Exchange Offers ]
      operationId: getMyOffers
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          $ref: '#/components/responses/UserOfferList'
        '403':
          description: Authentication required or invalid token
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    error: Access is forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /offer/accept:
    post:
      summary: Mark an offer as accepted
      description: >
        Allows an authenticated user to accept an available offer. This marks the offer as unavailable.
        The offer ID is provided in the request body. This endpoint also adds an exchange transaction which updates
        the exchange rate.
        Authenticated user must have enough USD or LBP in personal wallet as appropriate 
        before accepting offer; else, it is rejected. When an offer is accepted, it is removed from inflight
        for the selling party, and both users get recorded a wallet transaction in the appropriate transaction.
      tags: [ Exchange Offers ]
      operationId: acceptExchangeOffer
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
            examples:
              Example:
                summary: Accept offer by ID
                value:
                  id: 15
      responses:
        '200':
          $ref: '#/components/responses/OfferAccepted'
        '400':
          description: Invalid offer ID or already accepted
          content:
            application/json:
              examples:
                InvalidRequest:
                  summary: Offer not found or unavailable
                  value:
                    error: Offer is already taken or does not exist
        '401':
          $ref: '#/components/responses/BalanceNeededResponse'
        '403':
          description: Authentication required or invalid token
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    error: Access is forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                InternalError:
                  summary: Internal Error
                  value:
                    error: Internal server error
  /wallet:
    get:
      summary: Retrieve the authenticated user's wallet details
      tags: [ Wallet Management ]
      description: |
        This endpoint retrieves the details of the authenticated user's wallet.
        The user must provide a valid JWT token in the Authorization header. If the token is valid, the wallet details are returned.
        If the token is invalid or expired, an error response is provided.
      operationId: getWallet
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User's wallet details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
              examples:
                Success:
                  summary: Retrieved wallet details
                  value:
                    user_id: 1
                    usd_amount: 100.50
                    lbp_amount: 235000
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /wallet/transaction:
    get:
      summary: Retrieve a specific wallet transaction by ID
      tags: [ Wallet Management ]
      description: |
        Retrieves a specific wallet transaction by its ID. The user must provide a valid JWT token for authentication, 
        and the transaction ID must be specified. The transaction must be valid for the given authentication (cannot access
        other users' transactions).
      operationId: getWalletTransaction
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: The wallet transaction ID to retrieve
      responses:
        '200':
          description: Wallet transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
              examples:
                Success:
                  summary: Retrieved wallet transaction details
                  value:
                    id: 101
                    usd_amount: -20.00
                    lbp_amount: 1800000
                    added_date: "2025-04-14T08:30:00Z"
                    user_id: 1
                    description: "USD to LBP exchange"
        '400':
          description: Invalid wallet transaction input
          content:
            application/json:
              examples:
                InvalidTransaction:
                  summary: Invalid wallet transaction ID
                  value:
                    error: "Invalid wallet transaction input"
        '403':
          description: |
            Access is forbidden (user does not own the transaction) 
            or invalid authentication token
          content:
            application/json:
              examples:
                ForbiddenAccess:
                  summary: Forbidden access to transaction
                  value:
                    error: "Access is forbidden"
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
    post:
      summary: Add a new wallet transaction
      tags: [ Wallet Management ]
      description: |
        Allows an authenticated user to add a new wallet transaction. 
        The user must provide the transaction details, including the amount in USD or LBP and a description.
        If performing an exchange or withdrawal, the authenticated user must have enough balance in either LBP or USD as appropriate.
      operationId: addWalletTransaction
      security:
        - bearerAuth: [ ]
      requestBody:
        $ref: '#/components/requestBodies/WalletTransactionRequest'
      responses:
        '200':
          description: Wallet transaction successfully added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
              examples:
                Success:
                  summary: Successfully added wallet transaction
                  value:
                    id: 103
                    usd_amount: -20.00
                    lbp_amount: 1800000
                    added_date: "2025-04-15T10:00:00Z"
                    user_id: 1
                    description: "USD to LBP exchange"
        '400':
          description: Missing required fields or invalid input
          content:
            application/json:
              examples:
                MissingFields:
                  summary: Missing required fields
                  value:
                    error: "Missing required fields"
        '401':
          $ref: '#/components/responses/BalanceNeededResponse'
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /wallet/transactions:
    get:
      summary: Retrieve all wallet transactions for the authenticated user
      tags: [ Wallet Management ]
      description: |
        This endpoint retrieves all wallet transactions associated with the authenticated user.
        The user must provide a valid JWT token in the Authorization header. 
        If the token is valid, the user's wallet transactions are returned.
        If the token is invalid or expired, an error response is provided.
      operationId: getWalletTransactions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of wallet transactions for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletTransaction'
              examples:
                Success:
                  summary: Retrieved list of wallet transactions
                  value:
                    - id: 101
                      usd_amount: -20.00
                      lbp_amount: 1800000
                      added_date: "2025-04-14T08:30:00Z"
                      user_id: 1
                      description: "USD to LBP exchange"
                    - id: 109
                      usd_amount: 10.00
                      lbp_amount: -900000
                      added_date: "2025-04-15T09:00:00Z"
                      user_id: 1
                      description: "LBP to USD exchange"
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /wallet/reset:
    post:
      summary: Reset the user's wallet
      tags: [ Wallet Management ]
      description: |
        This endpoint resets the wallet of the authenticated user. It deletes all wallet transactions and resets the wallet balances to zero. The user must provide a valid OTP if multi-factor authentication (MFA) is enabled.
      operationId: resetWallet
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  type: string
                  description: One-time password (OTP) for MFA verification
            examples:
              Example:
                summary: Reset wallet with OTP
                value:
                  otp: "123456"
      responses:
        '200':
          description: Wallet successfully reset
        '400':
          description: Missing required fields
          content:
            application/json:
              examples:
                MissingFields:
                  summary: Missing OTP field
                  value:
                    error: "OTP is required"
        '401':
          description: TOTP required for users with MFA enabled
          content:
            application/json:
              examples:
                TotpRequired:
                  summary: MFA required
                  value:
                    error: "TOTP Required"
        '403':
          description: Invalid OTP or invalid authentication token
          content:
            application/json:
              examples:
                InvalidOtp:
                  summary: Invalid OTP
                  value:
                    error: "Invalid OTP"
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /wallet/transaction/delete:
    post:
      summary: Delete the most recent wallet transaction
      tags: [ Wallet Management ]
      description: |
        Allows the authenticated user to delete the most recent wallet transaction. 
        The user must have sufficient balance to remove the transaction if he has any outstanding offers 
        which have not been accepted by others yet.
      operationId: deleteWalletTransaction
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Wallet transaction successfully deleted
        '400':
          description: No transactions found or invalid transaction ID
          content:
            application/json:
              examples:
                NoTransaction:
                  summary: No transaction found
                  value:
                    error: "No transactions found"
        '401':
          description: Not enough balance to delete the transaction due to outstanding offers
          content:
            application/json:
              examples:
                NotEnoughUSD:
                  summary: Not enough USD balance
                  value:
                    error: "Not enough USD balance to remove wallet transaction without removing outstanding offers"
                NotEnoughLBP:
                  summary: Not enough LBP balance
                  value:
                    error: "Not enough LBP balance to remove wallet transaction without removing outstanding offers"
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
  /wallet/inflight:
    get:
      summary: Retrieve the authenticated user's wallet inflight details. Should not be used in normal circumstances.
      tags: [ Wallet Management ]
      description: |
        This endpoint retrieves the inflight (pending) USD and LBP amounts of the authenticated user's wallet.
        The user must provide a valid JWT token in the Authorization header. If the token is valid, the inflight wallet details are returned.
        If the token is invalid or expired, an error response is provided.
        The inflight wallet should not be used in normal circumstances as it is an implementation detail for offer consistency with the existing wallet
        and to ensure users adding offers not accepted yet do not run out of balance. However, because wallet details are not accurate if there are pending offers,
        this API is offered to get the true details of the status of the user's wallet.
      operationId: getWalletInflight
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: User's wallet inflight details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    description: ID of the user associated with the wallet inflight values
                  usd_inflight:
                    type: number
                    format: float
                    description: Amount of USD in-flight (currently pending offers)
                  lbp_inflight:
                    type: number
                    format: float
                    description: Amount of LBP in-flight (currently pending offers)
                required:
                  - user_id
                  - usd_inflight
                  - lbp_inflight
              examples:
                Example:
                  summary: Example wallet inflight details
                  value:
                    user_id: 1
                    usd_inflight: 50.00
                    lbp_inflight: 750000
        '403':
          description: Invalid or expired token
          content:
            application/json:
              examples:
                InvalidToken:
                  summary: Invalid or expired token
                  value:
                    error: "Invalid or expired token"
