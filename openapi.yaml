        application/json:
          schema:
            $ref: '#/components/schemas/Transaction'
          examples:
            Success:
              value:
                id: 21
                usd_amount: 100
                lbp_amount: 9000000
                usd_to_lbp: true
                user_id: 3
                added_date: '2025-04-09T18:25:00Z'
    TransactionList:
      description: List of transactions associated with the authenticated user
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Transaction'
          examples:
            Example:
              value:
                - id: 12
                  usd_amount: 10
                  lbp_amount: 900000
                  usd_to_lbp: true
