    PasswordStrengthResponse:
      description: Password strength evaluation result
      content:
        application/json:
          schema:
            type: object
            properties:
              strength_score:
                type: number
                description: A score representing the strength of the password (higher is stronger)
              classification:
                type: string
                enum: [ "Weak", "Moderate", "Strong" ]
                description: A textual classification of the password strength (e.g., "Weak", "Strong")
          examples:
            WeakExample:
              summary: Weak password strength example
              value:
                strength_score: 0.4
                classification: "Weak"
            ModerateExample:
              summary: Moderate password strength example
              value:
                strength_score: 0.65
                classification: "Moderate"
            StrongExample:
              summary: Strong password strength example
              value:
                strength_score: 0.85
                classification: "Strong"
    WeakPasswordResponse:
      description: Password complexity test verification fail
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                value: Invalid password
              tests:
                type: array
                description: Tests which have failed to pass
                items:
                  type: string
          examples:
            Example:
              summary: Password too short
              value:
                error: Invalid password
                tests:
                  - Password must be at least 12 characters long
