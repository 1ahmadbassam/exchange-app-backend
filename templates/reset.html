<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBP Exchange Tracker - Password Reset</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 2rem 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            color: #4b4b4b;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            transition: border 0.2s;
        }

        input[type="password"]:focus {
            border-color: #7c3aed;
            outline: none;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #6a28d9;
        }

        #error-message {
            display: none;
            color: red;
            margin-top: 1rem;
        }

        #error-message h3 {
            margin: 0 0 0.5rem;
        }

        ul {
            padding-left: 1.25rem;
        }

        li {
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Your Password</h2>
    <form id="password-reset-form">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" name="new_password" required/>
        <button type="submit">Reset Password</button>
    </form>
    <div id="error-message">
        <h3>Password Reset Error</h3>
        <p id="error-text"></p>
        <ul id="error-tests"></ul>
    </div>
</div>

<script>
    "use strict";
    const passwordInput = document.getElementById("new-password");
    const errorMessageElement = document.getElementById("error-message");
    const errorTextElement = document.getElementById("error-text");
    const errorTestsElement = document.getElementById("error-tests");

    passwordInput.addEventListener("input", function () {
        errorMessageElement.style.display = "none";
    });

    const sanitizeInput = (input) => {
        const temp = document.createElement('div');
        temp.textContent = input;
        return temp.innerHTML;
    };

    document.getElementById("password-reset-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const newPassword = sanitizeInput(passwordInput.value.trim());
        if (newPassword === "") return;

        fetch(`{{ reset_url }}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                password: newPassword
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);
                } else {
                    errorTextElement.textContent = data.error;
                    errorTestsElement.innerHTML = "";

                    if (data["tests"] && data["tests"].length > 0) {
                        data["tests"].forEach(test => {
                            const listItem = document.createElement("li");
                            listItem.textContent = test;
                            errorTestsElement.appendChild(listItem);
                        });
                    }
                    errorMessageElement.style.display = "block";
                }
            })
            .catch(error => {
                console.error("Error resetting password:", error);
                alert("An error occurred. Please try again.");
            });
    });
</script>
</body>
</html>
